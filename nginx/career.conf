# Include this additional vhost alongside the existing Verify configuration.
# The outer TLS proxy must forward career.itlive.uz to this nginx on port 8085.
server {
    listen 80;
    server_name career.itlive.uz;
    client_max_body_size 6M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/career/ {
        proxy_pass http://backend:4000/api/career/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ { return 404; }
    location /uploads/career-avatars/ {
        proxy_pass http://backend:4000/uploads/career-avatars/;
    }
    location /uploads/ { return 404; }
}
